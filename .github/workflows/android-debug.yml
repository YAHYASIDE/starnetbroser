name: Build Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish/update the release below

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Keep one signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: starnet-browser-debug-signing-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK (build artifact, for CI history)
        uses: actions/upload-artifact@v4
        with:
          name: STAR-NET-Browser-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish a direct-download link for this branch
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BRANCH="${{ github.head_ref || github.ref_name }}"
          # One stable tag per branch, so the download link never changes -
          # each new build on the same branch replaces the file in place.
          SAFE_TAG="debug-$(echo "$BRANCH" | tr '/' '-')"
          cp app/build/outputs/apk/debug/app-debug.apk STAR-NET-Browser-debug.apk
          if gh release view "$SAFE_TAG" >/dev/null 2>&1; then
            gh release upload "$SAFE_TAG" STAR-NET-Browser-debug.apk --clobber
          else
            gh release create "$SAFE_TAG" STAR-NET-Browser-debug.apk \
              --title "STAR NET Browser - $BRANCH (debug build)" \
              --notes "Auto-built debug APK for branch \`$BRANCH\`, commit ${{ github.sha }}. Always the latest build on this branch - re-download this same link any time." \
              --prerelease
          fi
          echo "### 📱 APK download link" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/$SAFE_TAG/STAR-NET-Browser-debug.apk" >> "$GITHUB_STEP_SUMMARY"
