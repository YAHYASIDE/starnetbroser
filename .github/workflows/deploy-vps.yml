name: Deploy to staging VPS

# Runs after every push to claude/cloud-remote-browser, but every step is
# gated on VPS_SSH_HOST existing as a repository secret - until you add
# that secret (see docs/DEPLOYMENT.md "Secrets management" and the list
# below), this workflow runs and immediately no-ops instead of failing, so
# it's safe to merge before a VPS exists.
#
# Required repository secrets once you have a VPS (Settings -> Secrets and
# variables -> Actions -> New repository secret):
#   VPS_SSH_HOST        the server's IP or hostname
#   VPS_SSH_USER         the deploy user (NOT root, ideally - a user in the
#                        `docker` group, see docs/DEPLOYMENT.md)
#   VPS_SSH_KEY          the PRIVATE half of an SSH key whose public half is
#                        already in that user's ~/.ssh/authorized_keys on
#                        the VPS - generate a dedicated deploy-only keypair,
#                        never reuse a personal one
#   VPS_SSH_PORT         optional, defaults to 22
#   VPS_DEPLOY_PATH       optional, defaults to /opt/starnetbroser - where
#                        the repo is checked out on the VPS
#
# This workflow never prints a secret value to logs (the `gh`/`ssh`/`scp`
# calls below only ever reference secrets as connection parameters, never
# echo them), and never touches YAHYASIDE/starnetcloud.

on:
  push:
    branches: [claude/cloud-remote-browser]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false # never interrupt a deploy that's already in flight

jobs:
  check-configured:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VPS_SSH_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_SSH_HOST secret not set - skipping VPS deploy. See this workflow file's header comment for the full list of secrets to add once a VPS exists."
          fi

  deploy:
    needs: check-configured
    if: needs.check-configured.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH (with rollback on failure)
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/starnetbroser' }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Runs scripts/deploy_remote.sh ON THE SERVER: piping a local file
          # into `ssh ... bash -s` avoids ever embedding a multi-line
          # remote script inline here (heredocs don't mix well with YAML's
          # indentation-sensitive block scalars - see git history for the
          # broken first attempt).
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" claude/cloud-remote-browser \
            < scripts/deploy_remote.sh

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
