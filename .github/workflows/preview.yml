name: Preview

on:
  push:
    # main: merging a PR auto-triggers the GitHub Pages deploy below.
    # claude/cloud-remote-browser, claude/local-isolated-browser: keep
    # pre-merge preview builds running on each feature branch's own PR.
    branches: [main, claude/cloud-remote-browser, claude/local-isolated-browser]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  test:
    name: Build & test (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starnet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/starnet_test
      # CI-only test fixtures, not real secrets - never used outside this
      # ephemeral job's Postgres service container.
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      VAULT_KEY: x3IBhv4f3yZuIM7O/UlM9Pv3oj2qJVR5f+Ow5WHluUI=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build packages/shared + local-browser-plugin
        run: npm run build:packages

      - name: Typecheck everything
        run: npm run typecheck

      - name: Apply Prisma migrations to the test database
        working-directory: services/api
        run: npx prisma migrate deploy

      # Deliberately NOT `npm run test` (which runs every workspace's test
      # script, browser-worker included) - this job has no Chromium/Xvfb/
      # x11vnc/websockify set up. browser-worker has its own dedicated
      # job below with that environment; scope this one to what it can
      # actually run. local-browser-plugin's and web's vitest suites are
      # plain Node/jsdom, no special environment needed, so they run here too.
      - name: Run shared + API + local-browser-plugin + web tests
        run: npm run test --workspace=@starnet/shared --workspace=@starnet/api --workspace=@starnet/local-browser-plugin --workspace=@starnet/web

  test-browser-worker:
    name: Browser worker (real Chromium session persistence + isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build packages/shared
        run: npm run build:shared

      - name: Install a real Chromium (pinned to match playwright-core's version)
        run: |
          npx --yes playwright@1.49.1 install --with-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chromium*' | head -1)"
          echo "Resolved Chromium at: $CHROME"
          test -x "$CHROME"
          echo "CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"

      # novnc is required here even though nothing renders its UI in
      # these tests: websockify is started with --web=/usr/share/novnc
      # (src/vnc/websockify.ts) and some versions exit immediately if
      # that path doesn't exist. The dev sandbox happened to have novnc
      # pre-installed already, which is what let this slip through
      # local testing - confirmed as the real cause from this job's own
      # "websockify exited early with code 1" failure.
      - name: Install Xvfb/x11vnc/websockify/novnc (apt has real internet access here, unlike the dev sandbox)
        run: sudo apt-get update && sudo apt-get install -y xvfb x11vnc websockify novnc

      - name: Run the real session-persistence + isolation test suite
        working-directory: services/browser-worker
        # Root, matching this session's actual runtime privilege level
        # (the production Dockerfile's default node:20 image user is
        # also root) - a plain unprivileged `npm test` fails here with
        # EACCES writing into /var/lib/docker/volumes/*/_data, which is
        # root-owned. `-E env "PATH=$PATH"` preserves the env vars set
        # above (CHROMIUM_EXECUTABLE_PATH) and actions/setup-node's PATH,
        # which sudo's default secure_path would otherwise drop.
        run: sudo -E env "PATH=$PATH" npm test

  deploy-pages-preview:
    name: Deploy safe demo preview to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build packages/shared + local-browser-plugin
        run: npm run build:packages

      - name: Build apps/web as a static export (demo data only)
        working-directory: apps/web
        # Served at the root of the custom domain (starnet.etssadagha.com via
        # the CNAME in apps/web/public), so NO basePath - assets must resolve
        # from "/", not "/starnetbroser". GitHub redirects the old
        # <user>.github.io/starnetbroser path to the custom domain root.
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_DATA_SOURCE: demo
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: |
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +'%Y-%m-%d %H:%M UTC')"
          npx next build

      - name: Mark output for GitHub Pages (skip Jekyll processing)
        run: touch apps/web/out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: Build & publish staging Android APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android@v3 tries to install the
      # long-removed "tools" SDK package and hard-fails. GitHub's
      # runners are documented to ship an Android SDK, but its actual
      # env var/layout isn't reliable enough to hardcode (confirmed:
      # neither ANDROID_HOME nor a cmdline-tools/*/bin/sdkmanager were
      # found on this runner) - so this uses whatever's already there
      # if present, and downloads cmdline-tools fresh otherwise.
      - name: Ensure Android SDK cmdline-tools + required packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No existing sdkmanager under $SDK_ROOT - downloading cmdline-tools"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - run: npm ci

      - name: Build packages/shared + local-browser-plugin
        run: npm run build:packages

      - name: Build apps/web as a static export for the WebView (demo data)
        working-directory: apps/web
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_DATA_SOURCE: demo
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: |
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +'%Y-%m-%d %H:%M UTC')"
          npx next build

      - name: Copy web export into the Capacitor app
        run: |
          rm -rf apps/android/www
          cp -r apps/web/out apps/android/www

      - name: Scaffold the Android native project (not committed - regenerated each build)
        working-directory: apps/android
        run: npx cap add android

      - name: Sync web assets + plugins into the Android project
        working-directory: apps/android
        # This is what wires packages/local-browser-plugin into the freshly
        # scaffolded project: it reads apps/android/package.json's
        # dependency on @starnet/local-browser-plugin (a real npm workspace
        # package, resolved via node_modules like any other), and writes
        # android/capacitor.settings.gradle + capacitor.build.gradle +
        # capacitor.plugins.json accordingly - no manual patch of the
        # generated android/ folder needed, so this survives every fresh
        # `cap add android` in every future CI run.
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: apps/android/android
        run: chmod +x gradlew

      # Every CI runner starts with no ~/.android/debug.keystore, so without this the Android
      # Gradle Plugin silently generates a brand-new one on first use - a different, random
      # signing certificate on every single build. Installing a newer APK over an older one then
      # fails with "package conflicts with an existing package" (signature mismatch), forcing
      # anyone testing the app to uninstall the old build first. Using this repo's own fixed,
      # committed debug keystore (apps/android/debug.keystore - the standard, non-secret Android
      # debug alias/password, never used for a real release signature) makes every build's
      # signature identical, so updates install cleanly.
      - name: Use a fixed debug keystore (keeps every build's signature identical)
        run: |
          mkdir -p "$HOME/.android"
          cp apps/android/debug.keystore "$HOME/.android/debug.keystore"

      - name: Run native plugin unit tests (account.id -> WebView profile isolation, see ProfileNamingTest)
        working-directory: apps/android/android
        run: ./gradlew :starnet-local-browser-plugin:testDebugUnitTest --no-daemon

      - name: Build the debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK to the fixed, documented asset name
        run: |
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk \
             STAR-NET-Browser-debug.apk

      - name: Publish to the staging-latest pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: staging-latest
          name: "STAR NET - Staging (latest)"
          body: |
            Automated staging build from commit ${{ github.sha }}.
            Demo data only - not connected to a real backend yet.
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: false
          artifacts: STAR-NET-Browser-debug.apk
          artifactContentType: application/vnd.android.package-archive
          token: ${{ secrets.GITHUB_TOKEN }}
