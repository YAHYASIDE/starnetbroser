name: Staging Preview

# Runs on every push to the cloud-remote-browser branch: backend tests ->
# Android build -> (only if BOTH succeeded) publish a stable "staging-latest"
# release with the APK, and a small GitHub Pages status page showing which
# commit/build that link currently serves.
#
# This never touches YAHYASIDE/starnetcloud, never deploys a real backend
# (GitHub Pages is static hosting only - no server, no Chromium, no
# Playwright, no database), and never puts real Starlink accounts or
# secrets anywhere near it - see docs/PAGES_PREVIEW.md.

on:
  push:
    branches: [claude/cloud-remote-browser]
  workflow_dispatch:

concurrency:
  group: staging-preview
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starnet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4

      - name: Build metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Backend lint
        working-directory: backend
        run: ruff check app
      - name: Build the test worker image (for the Docker-integration tests)
        run: |
          mkdir -p /tmp/workertest
          cat > /tmp/workertest/sleeper.c <<'EOF'
          #include <unistd.h>
          int main(void) { for (;;) pause(); return 0; }
          EOF
          gcc -static -O2 -o /tmp/workertest/sleeper /tmp/workertest/sleeper.c
          cat > /tmp/workertest/Dockerfile <<'EOF'
          FROM scratch
          COPY sleeper /sleeper
          ENTRYPOINT ["/sleeper"]
          EOF
          docker build -t starnet-worker-test:dev /tmp/workertest
      - name: Run backend migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/starnet_test
          JWT_SECRET: ci-only-secret
          VAULT_KEY: ci-only-vault-key
        run: alembic upgrade head
      # Deliberately NOT `continue-on-error` - every later step (APK build,
      # release publish, Pages deploy) must never run on a red test suite.
      - name: Run backend tests
        id: backend-tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/starnet_test
          JWT_SECRET: ci-only-secret
          VAULT_KEY: ci-only-vault-key
          FEATURE_CLOUD_SESSIONS: "true"
          WORKER_IMAGE: starnet-worker-test:dev
          WORKER_NETWORK: starnet_staging_net
          MAX_CONCURRENT_WORKERS: "2"
          WORKER_IDLE_TIMEOUT_SECONDS: "1"
          LOGIN_RATE_LIMIT_PER_MINUTE: "1000"
        run: |
          # GitHub Actions' default bash already runs with -o pipefail, but
          # set it explicitly: a piped pytest failure must fail this step
          # (and therefore skip every later step - APK build, release
          # publish, Pages deploy), not be hidden behind `tee`'s own
          # exit code.
          set -o pipefail
          pytest -v | tee /tmp/pytest-output.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Keep one signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: starnet-browser-debug-signing-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -PgitCommit=${{ steps.meta.outputs.short_sha }}

      - name: Publish staging-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk STAR-NET-Browser-debug.apk
          NOTES="Auto-built staging APK - commit ${{ steps.meta.outputs.short_sha }}, built ${{ steps.meta.outputs.build_time }} UTC. Always the latest passing build on claude/cloud-remote-browser."
          if gh release view staging-latest >/dev/null 2>&1; then
            gh release upload staging-latest STAR-NET-Browser-debug.apk --clobber
            gh release edit staging-latest --notes "$NOTES"
          else
            gh release create staging-latest STAR-NET-Browser-debug.apk \
              --title "STAR NET Browser - staging (latest)" \
              --notes "$NOTES" \
              --prerelease
          fi
          {
            echo "### ✅ تم النشر"
            echo "- **Commit**: \`${{ steps.meta.outputs.short_sha }}\`"
            echo "- **وقت البناء**: ${{ steps.meta.outputs.build_time }} UTC"
            echo "- **[⬇️ تنزيل APK المباشر](https://github.com/${{ github.repository }}/releases/download/staging-latest/STAR-NET-Browser-debug.apk)**"
            echo "- **[فتح آخر نسخة تجريبية](https://${{ github.repository_owner }}.github.io/$(echo '${{ github.repository }}' | cut -d/ -f2)/)**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the Pages status page
        run: |
          mkdir -p public
          PASS_COUNT=$(grep -oE '[0-9]+ passed' /tmp/pytest-output.txt | tail -1 | grep -oE '[0-9]+' || echo "?")
          FAIL_COUNT=$(grep -oE '[0-9]+ failed' /tmp/pytest-output.txt | tail -1 | grep -oE '[0-9]+' || echo "0")
          python3 scripts/render_status_page.py \
            --commit "${{ steps.meta.outputs.short_sha }}" \
            --commit-url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
            --build-time "${{ steps.meta.outputs.build_time }}" \
            --pass-count "$PASS_COUNT" \
            --fail-count "$FAIL_COUNT" \
            --apk-url "https://github.com/${{ github.repository }}/releases/download/staging-latest/STAR-NET-Browser-debug.apk" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out public/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
