# Local dev / VPS starting point. See docs/DEPLOYMENT.md before exposing
# this to the internet (TLS termination, firewall, backups).
#
# Worker containers are NOT declared here as fixed services - the backend
# starts/stops them on demand via the Docker Engine API (see
# app/browser/manager.py), which is why `backend` needs access to the
# Docker socket below. That is a real security tradeoff (the backend
# container can control the whole Docker daemon); docs/DEPLOYMENT.md
# documents the safer docker-socket-proxy alternative for later.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starnet}
      POSTGRES_USER: ${POSTGRES_USER:-starnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
    volumes:
      - starnet_db_data:/var/lib/postgresql/data
    networks: [starnet_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starnet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-starnet}:${POSTGRES_PASSWORD:?set a real password in .env}@db:5432/${POSTGRES_DB:-starnet}
      JWT_SECRET: ${JWT_SECRET:?set a real random secret in .env}
      VAULT_KEY: ${VAULT_KEY:?set a real Fernet key in .env}
      FEATURE_CLOUD_SESSIONS: ${FEATURE_CLOUD_SESSIONS:-false}
      WORKER_IMAGE: starnet-browser-worker:dev
      WORKER_NETWORK: starnet_internal
      MAX_CONCURRENT_WORKERS: ${MAX_CONCURRENT_WORKERS:-4}
      WORKER_IDLE_TIMEOUT_SECONDS: ${WORKER_IDLE_TIMEOUT_SECONDS:-300}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["*"]}
    volumes:
      # Lets the backend start/stop worker containers via the Docker Engine
      # API. See docs/DEPLOYMENT.md "Docker socket access" for the
      # docker-socket-proxy hardening option.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [starnet_internal]
    ports:
      - "127.0.0.1:8000:8000"  # bind to localhost only; nginx/caddy in front does TLS - see docs/DEPLOYMENT.md

  worker:
    # Not started as a running service - this entry exists only so
    # `docker compose build` produces the `starnet-browser-worker:dev`
    # image the backend launches on demand. `profiles: [build-only]` keeps
    # `docker compose up` from starting a standing instance of it.
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: starnet-browser-worker:dev
    profiles: ["build-only"]
    networks: [starnet_internal]

networks:
  # A private Docker bridge network - not Docker's `internal: true` mode,
  # because workers need outbound HTTPS to reach starlink.com. The actual
  # inbound boundary is that worker containers are started with NO
  # published host ports (see app/browser/manager.py); only the backend,
  # sharing this network, can reach a worker's control/VNC ports at all,
  # and only over the container-name DNS Docker provides on this network -
  # nothing here is reachable from the host or the internet.
  starnet_internal:
    driver: bridge

volumes:
  starnet_db_data:
