ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.6.1'
    // NotificationCompat/NotificationManagerCompat (SyncNotifier) - pinned explicitly rather than
    // relying on whatever version happens to resolve transitively through appcompat.
    androidxCoreVersion = project.hasProperty('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.12.0'
    // Capacitor's own core Android module (node_modules/@capacitor/android/capacitor/build.gradle)
    // already depends on this exact androidx.webkit version by default, and that is the version
    // that introduced the Multi-Profile API this plugin is built on - reusing the same
    // rootProject.ext key (with the same fallback default) guarantees this resolves to a version
    // already proven to build in this toolchain, instead of guessing a newer number.
    androidxWebkitVersion = project.hasProperty('androidxWebkitVersion') ? rootProject.ext.androidxWebkitVersion : '1.9.0'
    // Powers AutoSyncWorker's periodic background sync (see AutoSyncScheduler) - WorkManager is
    // the platform-sanctioned way to run deferred/periodic background work post-Android 8's
    // background execution limits, rather than a raw Service or AlarmManager.
    androidxWorkVersion = project.hasProperty('androidxWorkVersion') ? rootProject.ext.androidxWorkVersion : '2.9.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.1.5'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.5.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.starnetbroser.localbrowser"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 22
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    publishing {
        singleVariant("release")
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    testImplementation "junit:junit:$junitVersion"
    // PendingSyncStoreTest exercises org.json.JSONObject/JSONArray directly. Android's compile-time
    // android.jar (also what testDebugUnitTest runs against by default) stubs every org.json.*
    // method to throw RuntimeException("...not mocked...") just like any other android.jar class -
    // this real implementation on the test classpath is what makes those calls actually work
    // instead of crashing every test that touches them.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
